[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-sztu"
version = "0.2.0"
description = "Event-centered, source-linked archive tooling for Digital SZTU"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "jsonschema>=4.20,<5"
]

[project.urls]
Repository = "https://github.com/Shuang-su/digital-sztu"

[project.scripts]
digital-sztu = "digital_sztu.cli:main"
sztu-connect = "digital_sztu.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
digital_sztu = ["assets/*.html", "assets/*.css", "assets/*.js"]
