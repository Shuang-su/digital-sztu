name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m compileall -q src tests scripts
      - name: Verify preserved source archives offline
        run: python importers/verify_archives.py
      - run: digital-sztu public-check --json
      - run: digital-sztu privacy-scan --strict --json
      - run: digital-sztu check --json
      - run: python -m unittest discover -s tests
      - run: digital-sztu build --json
      - run: git diff --exit-code -- data/generated

  bootstrap:
    name: Bootstrap (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SZTU_BOOTSTRAP_INTEGRATION: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -p test_bootstrap.py -v
      - run: python -m unittest discover -s tests -p test_exploration_guidance.py -v
      - run: git diff --exit-code
